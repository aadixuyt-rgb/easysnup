name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [swap, give]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build (${{ matrix.variant }})
        run: gradle build -Pvariant=${{ matrix.variant }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: easysnup-${{ matrix.variant }}
          path: build/libs/*-${{ matrix.variant }}.jar
